name: slink_app
description: "Slink — feature-first chat app with Riverpod, go_router, Dio, SQLite."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  intl: ^0.19.0

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.7.0
  stomp_dart_client: ^3.0.1

  # Secure storage for JWT
  flutter_secure_storage: ^9.2.2

  # Local SQLite cache
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Utilities
  timeago: ^3.7.0
  cached_network_image: ^3.4.1
  sqflite_common_ffi: ^2.4.0+3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
